  <div class="topbar-actions">

      <span></span><span></span><span></span>

<!-- ============ MOBILE MENU ============ -->

<main>
  <section class="section">
    <div class="section-inner narrow">
      <div class="eyebrow">My Account</div>
      <h2 class="h2">Your membership</h2>

      <div class="glass-card dashboard-card">
        <div class="dashboard-email" id="dashboardEmail"></div>
        <div class="dashboard-status" id="dashboardStatus">Checking subscription…</div>
        <div class="dashboard-content" id="dashboardContent"></div>
      </div>

      <div class="account-programs" id="accountProgramsSection" hidden>
        <div id="programsList"></div>
      </div>

      <div class="account-actions">
        <button class="btn btn-pill btn-sm btn-outline-rose" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </section>
</main>
